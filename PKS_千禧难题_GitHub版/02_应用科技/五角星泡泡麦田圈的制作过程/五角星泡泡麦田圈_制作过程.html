<script>
var SRC = document.getElementById('src').textContent;
var STEPS = [
  {"n":1,"t":"定基底","d":"矩形窗口＋圆弧，标出中心点列"},
  {"n":2,"t":"连骨架","d":"中心点相连，勾出五角星骨架"},
  {"n":3,"t":"收骨架","d":"骨架收拢到作图区"},
  {"n":4,"t":"局部放大","d":"放大：蓝、绿、红三圆相切"},
  {"n":5,"t":"映射回全景","d":"相切半径按比例映回窗口"},
  {"n":6,"t":"主圆落位","d":"蓝色主圆成形"},
  {"n":7,"t":"细部放样","d":"同心圆族与切线网定泡泡圆心"},
  {"n":8,"t":"半径校准","d":"主圆复现，半径校准"},
  {"n":9,"t":"泡泡点位","d":"绿圆与红圈落点，泡泡成形"},
  {"n":10,"t":"完成","d":"中央蓝圆＋五角星泡泡环绕"}
];
var HOLD = 1900, ENDHOLD = 3200;
var idx = 0, timer = null, playing = true;

var frames = [].slice.call(document.querySelectorAll('.frame'));
frames.forEach(function(f){
  var s = f.querySelector('svg');
  s.innerHTML = SRC;
});

var list = document.getElementById('list');
STEPS.forEach(function(st, k){
  var d = document.createElement('div');
  d.className = 'item';
  d.innerHTML = '<div class="no">' + (k+1 < 10 ? '0' : '') + (k+1) + '</div><div class="tx"><b>' + st.t + '</b><span>' + st.d + '</span></div>';
  d.onclick = function(){ go(k, true); };
  list.appendChild(d);
});
var items = [].slice.call(list.children);
var curEl = document.getElementById('cur'), pi = document.getElementById('pi');
var capEl = document.getElementById('cap'), playBtn = document.getElementById('play');

function go(n, manual){
  idx = Math.max(0, Math.min(STEPS.length-1, n));
  frames.forEach(function(f, k){ f.classList.toggle('on', k === idx); });
  items.forEach(function(it, k){
    it.classList.toggle('on', k === idx);
    it.classList.toggle('done', k < idx);
  });
  curEl.textContent = (idx+1 < 10 ? '0' : '') + (idx+1);
  pi.style.width = ((idx+1) / STEPS.length * 100) + '%';
  var st = STEPS[idx];
  capEl.innerHTML = '<b>' + ((idx+1 < 10 ? '0' : '') + (idx+1)) + ' ' + st.t + '</b>　' + st.d;
  if(manual) restartTimer();
}

function next(){
  if(idx >= STEPS.length-1){ go(0, false); }
  else go(idx+1, false);
  restartTimer();
}

function restartTimer(){
  if(timer) clearTimeout(timer);
  if(!playing) return;
  var hold = (idx >= STEPS.length-1) ? ENDHOLD : HOLD;
  timer = setTimeout(next, hold);
}

function setPlaying(p){
  playing = p;
  playBtn.textContent = p ? '暂停' : '播放';
  if(p) restartTimer(); else if(timer) clearTimeout(timer);
}

playBtn.onclick = function(){ setPlaying(!playing); };
document.getElementById('prev').onclick = function(){ go(idx-1, true); };
document.getElementById('next').onclick = function(){ go(idx+1, true); };
document.getElementById('again').onclick = function(){ go(0, true); setPlaying(true); };

document.addEventListener('keydown', function(e){
  if(e.code === 'Space'){ e.preventDefault(); setPlaying(!playing); }
  else if(e.code === 'ArrowRight'){ go(idx+1, true); }
  else if(e.code === 'ArrowLeft'){ go(idx-1, true); }
});

var qs = new URLSearchParams(location.search);
var s0 = parseInt(qs.get('step'), 10);
go((!isNaN(s0) && s0 >= 1) ? s0-1 : 0, false);
setPlaying(qs.get('auto') !== '0');
</script>
