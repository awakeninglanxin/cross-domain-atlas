let mode = 'task';
const tb = document.getElementById('tb'), q = document.getElementById('q'),
      cnt = document.getElementById('cnt'), chips = document.getElementById('chips');
let proj = null;
let lastRows = [];
function render() {
  const kw = q.value.trim().toLowerCase();
  const SRC = mode === 'task' ? DATA : PEND;
  const rows = SRC.filter(d => (!proj || d.p === proj) &&
      (!kw || d.t.toLowerCase().includes(kw)));
  lastRows = rows;
  const slice = rows.slice(0, 800);
  tb.innerHTML = slice.map(d => {
    let t = d.t;
    if (kw) {
      const i = t.toLowerCase().indexOf(kw);
      if (i >= 0) t = t.slice(0, i) + '<mark>' + t.slice(i, i + kw.length) + '</mark>' + t.slice(i + kw.length);
    }
    const badge = (mode === 'pend' && d.kind) ? `<span class="kb kb-${d.kind}">${d.kind}</span>` : '';
    const pub = (mode === 'pend' && d.f)
        ? (d.pub === 'yes' ? '<span class="pub y">已发布</span>' : '<span class="pub n">未发布</span>')
        : '';
    return `<tr><td class="d">${d.d}</td><td class="p">${d.p}</td><td>${badge}${t}${pub}</td><td class="w">${d.w}</td></tr>`;
  }).join('');
  cnt.textContent = `命中 ${rows.length} 条` + (rows.length > 800 ? '（只显示前 800 条，请输入关键词缩小）' : '');
}
document.getElementById('pendBtn').onclick = function () {
  mode = (mode === 'task') ? 'pend' : 'task';
  this.classList.toggle('on', mode === 'pend');
  document.querySelector('h1').textContent = (mode === 'pend')
      ? 'WorkBuddy 挂账 · 未完成 / 未发布' : 'WorkBuddy 任务索引';
  render();
};
q.addEventListener('input', render);
chips.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const on = b.classList.contains('on');
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('on'));
  if (on) { proj = null; } else { b.classList.add('on'); proj = b.dataset.p; }
  render();
});

/* ---------- CSV 导出（带 BOM，Excel 双击不乱码） ---------- */
function q1(s) { return '"' + String(s).replace(/"/g, '""') + '"'; }
function save(name, text) {
  const blob = new Blob(['\ufeff' + text], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.getElementById('csvRows').onclick = () => {
  const head = ['日期', '项目', '任务', '工作区'].map(q1).join(',');
  const body = lastRows.map(d => [d.d, d.p, d.t, d.w].map(q1).join(',')).join('\n');
  save(`WorkBuddy任务_${lastRows.length}条_${new Date().toISOString().slice(0, 10)}.csv`,
       head + '\n' + body);
};
document.getElementById('csvProj').onclick = () => {
  const m = {};
  lastRows.forEach(d => { m[d.p] = (m[d.p] || 0) + 1; });
  const head = ['项目', '任务数'].map(q1).join(',');
  const body = Object.entries(m).sort((a, b) => b[1] - a[1])
      .map(([k, v]) => [k, v].map(q1).join(',')).join('\n');
  save(`WorkBuddy项目汇总_${new Date().toISOString().slice(0, 10)}.csv`, head + '\n' + body);
};
document.getElementById('csvPend').onclick = () => {
  const head = ['状态', '发布日期', '项目', '任务', '涉及文件', '是否已发布', '工作区'].map(q1).join(',');
  const order = {'未push': 0, '未发布': 1, '挂账': 2, '未做': 3, '待定': 4};
  const rows = PEND.slice().sort((a, b) =>
      ((order[a.kind] ?? 9) - (order[b.kind] ?? 9)) || (a.d < b.d ? 1 : -1));
  const body = rows.map(d => [d.kind, d.d, d.p, d.t, d.f || '',
      d.pub === 'yes' ? '已发布' : (d.pub === 'no' ? '未发布' : '未找到文件'), d.w]
      .map(q1).join(',')).join('\n');
  save(`WorkBuddy挂账_${rows.length}条_${new Date().toISOString().slice(0, 10)}.csv`, head + '\n' + body);
};
